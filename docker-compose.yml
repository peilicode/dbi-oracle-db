services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-dbi
    environment:
      ORACLE_PASSWORD: dbi2026
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m

volumes:
  oracle-data:
